# =============================================================
# CDC 同步工具 - 集群连接配置（示例）
# 用法：复制为 settings.yaml 并填入真实值。settings.yaml 已被 .gitignore 忽略。
# 支持用 ${ENV_VAR} 引用环境变量，避免明文密码入库。
# =============================================================

mysql:
  host: 192.168.1.10
  port: 3306
  user: debezium
  password: ${MYSQL_PASSWORD}      # 或直接写明文（不推荐）
  charset: utf8mb4

clickhouse:
  host: 192.168.1.20
  port: 8123                        # HTTP 端口（clickhouse-connect 用）
  user: default
  password: ${CK_PASSWORD}
  database: default                 # 三对象所在库
  secure: false                     # 是否 https

kafka:
  broker_list: kafka:9092           # CK Kafka 引擎与 Debezium 使用
  # 生成 CK Kafka 表 / 连接器时写入

schema_registry:
  url: http://schema-registry:8081

connect:
  url: http://connect:8083          # Kafka Connect REST

# Debezium 连接器公共默认（可被 tables.yaml 覆盖）
debezium:
  connector_name: mysql-business-connector
  server_name: mysql-business       # database.server.name
  server_id: 1001                   # database.server.id（集群内唯一）
  tasks_max: 4
  snapshot_mode: initial
  history_topic: schema-changes.mysql-business
