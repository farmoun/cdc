# =============================================================
# CDC 同步栈 —— 部署在 ClickHouse 所在服务器(B 服)  ·  Kafka 3 节点高可用版
# MySQL(A 服) / ClickHouse(B 服宿主机原生) 均为外部服务，通过 .env 配置
# 启动：cp .env.example .env && 改好 .env && docker compose up -d --build
#
# Kafka：3 节点 KRaft（broker+controller 合并角色），RF=3 / min ISR=2
# 宿主机原生 ClickHouse 通过 localhost:9094,9095,9096 消费三个 broker
# =============================================================

# 三个 broker 复用的公共环境（YAML 锚点）
x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.1
  environment: &kafka-common-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    # 高可用副本参数
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    CLUSTER_ID: cdc-kraft-cluster-0001
  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
    interval: 15s
    timeout: 10s
    retries: 12

services:

  # ---------------- Kafka broker 1 ----------------
  kafka1:
    <<: *kafka-common
    container_name: cdc-kafka1
    ports:
      - "9094:9094"          # 宿主机映射：原生 ClickHouse 用 localhost:9094
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9094
    volumes:
      - kafka1-data:/var/lib/kafka/data

  # ---------------- Kafka broker 2 ----------------
  kafka2:
    <<: *kafka-common
    container_name: cdc-kafka2
    ports:
      - "9095:9095"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9095
    volumes:
      - kafka2-data:/var/lib/kafka/data

  # ---------------- Kafka broker 3 ----------------
  kafka3:
    <<: *kafka-common
    container_name: cdc-kafka3
    ports:
      - "9096:9096"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9096
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # ---------------- Schema Registry ----------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: cdc-schema-registry
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka1:9092,PLAINTEXT://kafka2:9092,PLAINTEXT://kafka3:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------- Kafka Connect (Debezium) ----------------
  connect:
    build:
      context: ..
      dockerfile: docker/connect.Dockerfile
    image: cdc-connect:latest
    container_name: cdc-connect
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
      schema-registry: { condition: service_started }
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: cdc-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _cdc_connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _cdc_connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _cdc_connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ---------------- 监控 Web 应用 ----------------
  cdc-monitor:
    build:
      context: ..
      dockerfile: docker/monitor.Dockerfile
    image: cdc-monitor:latest
    container_name: cdc-monitor
    depends_on:
      connect: { condition: service_started }
    env_file:
      - .env
    ports:
      - "${MONITOR_PORT:-8080}:8000"
    extra_hosts:
      # 让容器用 host.docker.internal 访问宿主机上的原生 ClickHouse（Linux 需要）
      - "host.docker.internal:host-gateway"
    volumes:
      - ../config:/app/config      # tables.yaml / settings.docker.yaml / 可放 .sql 导出
      - ../cdc_sync:/app/cdc_sync  # 应用代码（改了 exec 重跑即生效，不用重建镜像）
      - ../templates:/app/templates # CK 建表模板
      - ../main.py:/app/main.py
      - ../out:/app/out            # 生成产物持久化

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
